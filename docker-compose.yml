servicess:
  redis:
    image: redis

  db:
    image: postgres:13
    environment:
     POSTGRES_PASSWORD: 1234
  vote:
    image: dockersamples/examplevotingapp_vote
    ports:
      - 5000:80
    depends_on:
      - redis 

  result:
    image: dockersamples/examplevotingapp_result
    ports:
      - 5001:80
    depends_on:
      - db

  worker:
    image: dockersamples/examplevotingapp_worker
    depends_on:
      - db
      - redis
